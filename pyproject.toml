[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-gate"
version = "0.1.0"
description = "Aegis Gate inbound safety gateway"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "pydantic==2.10.4",
  "PyYAML==6.0.2",
  "sqlmodel==0.0.22",
  "sse-starlette==2.2.1",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["fixtures/**/*", "policies/*.yml", "policies/*.yaml"]
