name: default
description: Aegis Gate declarative default policy for scans and tool calls.
thresholds:
  review: 45
  deny: 75
blocked_taints:
  - path_traversal
  - unsafe_tool
approval_taints:
  - personal_data
  - encoded_content
protected_actions:
  - agent_tool
  - execute_tool
rule_actions:
  injection.ignore_instructions: deny
  injection.role_hijack: deny
  injection.delimiter_spoofing: deny
  exfiltration.secrets: deny
  filesystem.traversal: deny
  tools.unsafe_name: deny
  execution.dangerous_command: review
  privacy.pii: review
  encoding.obfuscated_payload: review
  content.hidden_markup: review
  content.social_engineering: review
tool_policies:
  send_email:
    deny_untrusted_risk_gte: 30
    deny_if:
      untrusted_provenance: true
      risk_gte: 30
    recipient_domain_allowlist:
      - example.com
      - example.org
      - internal.test
    recipient_domain_approval_allowlist:
      - example.com
      - example.org
      - internal.test
  read_file:
    sandbox_root: fixtures
    deny_secret_patterns:
      - ".."
      - "/etc/passwd"
      - ".ssh"
      - ".env"
      - "secret"
      - "private_key"
      - "id_rsa"
  fetch_page:
    rate_limit: 10
    max_per_minute: 10
    window_seconds: 60
global:
  canary_token: CANARY-7731
  canary_severity: critical
